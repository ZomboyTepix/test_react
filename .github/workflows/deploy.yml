name: Terraform Provide AWS

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "eu-west-3"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Docker Insecure Registry
        run: |
          sudo bash -c 'cat > /etc/docker/daemon.json <<EOF
          {
            "insecure-registries": ["${{ secrets.REGISTRY_IP }}:443"]
          }
          EOF'
          sudo systemctl restart docker
          sleep 5

      - name: Validate Credentials and Configure Docker Auth
        run: |
          echo "Testing credentials against the registry directly with curl..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}" -k https://${{ secrets.REGISTRY_IP }}:443/v2/)
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Authentication failed! HTTP Status: $HTTP_STATUS. Please check your GitHub Secrets (REGISTRY_USER and REGISTRY_PASSWORD). Make sure there are no spaces at the end!"
            exit 1
          fi
          echo "Credentials are valid!"
          
          echo "Writing Docker config manually to avoid credsStore issues..."
          mkdir -p ~/.docker
          AUTH_BASE64=$(echo -n "${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}" | base64 -w 0)
          cat <<EOF > ~/.docker/config.json
          {
            "auths": {
              "${{ secrets.REGISTRY_IP }}:443": {
                "auth": "$AUTH_BASE64"
              }
            }
          }
          EOF

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.REGISTRY_IP }}:443/backend:latest -f Dockerfile .
          docker push ${{ secrets.REGISTRY_IP }}:443/backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.REGISTRY_IP }}:443/frontend:latest -f React/Dockerfile React/
          docker push ${{ secrets.REGISTRY_IP }}:443/frontend:latest

  provision-and-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure S3 Bucket Exists
        run: |
          aws s3api head-bucket --bucket test-react-tf-state-bucket-juliotepixtle 2>/dev/null || aws s3api create-bucket --bucket test-react-tf-state-bucket-juliotepixtle --region eu-west-3 --create-bucket-configuration LocationConstraint=eu-west-3

      - name: Terraform Init
        working-directory: ./app-infra
        run: terraform init

      - name: Terraform Apply
        working-directory: ./app-infra
        run: terraform apply -auto-approve

      - name: Extraire les outputs Terraform
        id: tf-outputs
        working-directory: ./app-infra
        run: |
          INSTANCE_IP=$(terraform output -raw instance_ip)
          echo "APP_IP=$INSTANCE_IP" >> $GITHUB_ENV
          
          # La clé est enregistrée par Terraform dans un fichier local_file
          # Mais pour être sûr, on lui donne les bons droits
          chmod 400 app-key-terraform.pem

      - name: Créer le fichier inventory.ini pour Ansible
        working-directory: ./app-infra
        run: |
          cat <<EOF > inventory.ini
          [app_hosts]
          $APP_IP

          [app_hosts:vars]
          ansible_user=ubuntu
          ansible_ssh_private_key_file=app-key-terraform.pem
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

      - name: Setup Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Exécuter le Playbook Ansible Applicatif
        working-directory: ./app-infra
        env:
          REGISTRY_IP: ${{ secrets.REGISTRY_IP }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ansible-playbook -i inventory.ini playbook.yml

      - name: Validation Post-Déploiement (Attente et curl)
        run: |
          echo "Attente de 30 secondes pour laisser les conteneurs démarrer..."
          sleep 30
          
          echo "Vérification du Frontend (Port 3000)..."
          curl -f http://$APP_IP:3000 || exit 1
          
          echo "Vérification du Backend (Port 8000)..."
          curl -f http://$APP_IP:8000/docs || exit 1
          
          echo "✅ Déploiement validé avec succès !"
